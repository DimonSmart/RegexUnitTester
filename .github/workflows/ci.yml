name: CI

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RegexUnitTester.sln
      - run: dotnet build RegexUnitTester.sln --no-restore --configuration Release
      - run: dotnet test RegexUnitTester.sln --no-restore --framework net8.0
      - run: dotnet test RegexUnitTester.sln --no-restore --framework net9.0
      - run: dotnet test RegexUnitTester.sln --no-restore --framework net10.0
      - run: dotnet test ../DimonSmart.RegexUnitTester.Tests/DimonSmart.RegexUnitTester.Tests.csproj --no-restore --framework net10.0 -p:UseMtp=true
        working-directory: MtpSmoke
      - run: dotnet pack RegexUnitTester.sln --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.nupkg
